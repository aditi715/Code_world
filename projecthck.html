<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CivicEase 🏛️</title>
  <style>
    /* Reset and base */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background: linear-gradient(to bottom, #ebf8ff, #dbeafe);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    button {
      cursor: pointer;
      border: none;
      outline: none;
      font-family: inherit;
    }
    /* Header */
    header {
      background-color: #2563eb;
      color: white;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgb(37 99 235 / 0.5);
      user-select: none;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
    }
    .voice-btn {
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.875rem;
      transition: background-color 0.3s ease;
      color: white;
      background-color: #22c55e; /* green-500 */
    }
    .voice-btn.listening {
      background-color: #ef4444; /* red-500 */
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 3rem 1rem 4rem;
      animation: fadeSlideDown 0.7s ease forwards;
      opacity: 0;
      transform: translateY(-30px);
      max-width: 600px;
      margin: 0 auto;
    }
    .hero h2 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #1e293b;
    }
    .hero p {
      font-size: 1.125rem;
      color: #475569;
      margin-bottom: 1.5rem;
    }
    .hero button {
      background-color: #2563eb;
      color: white;
      padding: 0.75rem 2.5rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 10px 15px -3px rgb(37 99 235 / 0.5);
      transition: transform 0.2s ease;
    }
    .hero button:hover {
      transform: scale(1.05);
    }

    /* Category Cards */
    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem;
      max-width: 960px;
      margin: 0 auto 3rem;
      padding: 0 1rem;
      opacity: 0;
      animation: fadeIn 0.7s ease forwards;
      animation-delay: 0.7s;
    }
    .card {
      background: white;
      border-radius: 1.5rem;
      padding: 1.5rem;
      box-shadow: 0 10px 15px rgb(0 0 0 / 0.1);
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease;
      user-select: none;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card .icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .card h3 {
      margin: 0;
      font-weight: 600;
      color: #1e293b;
    }

    /* Floating Chatbot */
    .chatbot {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      width: 320px;
      max-height: 480px;
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 20px 30px rgb(0 0 0 / 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 0;
      transform: translateY(50px);
      animation: fadeSlideUp 0.3s ease forwards;
      user-select: text;
      z-index: 1000;
    }
    .chatbot-header {
      background-color: #2563eb;
      color: white;
      padding: 0.75rem 1rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .chatbot-header button {
      background: transparent;
      color: white;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      border: none;
      padding: 0;
      margin: 0;
      user-select: none;
    }
    .chatbot-messages {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: #f9fafb;
    }
    .message {
      max-width: 70%;
      padding: 0.5rem 0.75rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      line-height: 1.3;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .message.bot {
      background-color: #bfdbfe;
      align-self: flex-start;
      color: #1e293b;
    }
    .message.user {
      background-color: #bbf7d0;
      align-self: flex-end;
      color: #14532d;
    }

    .chatbot-input-area {
      display: flex;
      align-items: center;
      padding: 0.5rem 0.75rem;
      border-top: 1px solid #e2e8f0;
      background: white;
    }
    .chatbot-input-area input[type="text"] {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 9999px;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      outline-offset: 2px;
      transition: border-color 0.2s ease;
    }
    .chatbot-input-area input[type="text"]:focus {
      border-color: #2563eb;
    }
    .chatbot-input-area button {
      margin-left: 0.5rem;
      border-radius: 9999px;
      padding: 0.5rem 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: white;
      background-color: #2563eb;
      transition: background-color 0.3s ease;
      user-select: none;
    }
    .chatbot-input-area button:hover:not(.mic-btn) {
      background-color: #1e40af;
    }
    .mic-btn {
      margin-left: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: 9999px;
      font-size: 1.25rem;
      user-select: none;
      border: none;
      transition: background-color 0.3s ease, color 0.3s ease;
      background-color: #e5e7eb;
      color: #374151;
    }
    .mic-btn.listening {
      background-color: #ef4444;
      color: white;
    }

    /* Floating chat open button */
    .open-chat-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background-color: #2563eb;
      color: white;
      border-radius: 9999px;
      padding: 1rem;
      font-size: 1.5rem;
      box-shadow: 0 10px 15px rgb(37 99 235 / 0.5);
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease;
      user-select: none;
      z-index: 1000;
    }
    .open-chat-btn:hover {
      transform: scale(1.1);
    }

    /* Animations */
    @keyframes fadeSlideDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
    @keyframes fadeSlideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Scrollbar for messages */
    .chatbot-messages::-webkit-scrollbar {
      width: 6px;
    }
    .chatbot-messages::-webkit-scrollbar-thumb {
      background-color: #93c5fd;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <header>
    <h1>CivicEase 🏛️</h1>
    <button id="header-voice-btn" class="voice-btn" aria-pressed="false">🎙️ Voice Command</button>
  </header>

  <main style="flex-grow:1;">
    <section class="hero" aria-label="Hero section">
      <h2>Get Government Help in Minutes</h2>
      <p>Aadhaar updates, ration cards, electricity bills, and more — simplified for you.</p>
      <button id="start-chat-btn" aria-haspopup="dialog" aria-controls="chatbot" aria-expanded="false">Start Chat</button>
    </section>

    <section class="categories" aria-label="Service categories">
      <div class="card" tabindex="0" role="button" aria-pressed="false">
        <div class="icon" aria-hidden="true">📜</div>
        <h3>Ration Card</h3>
      </div>
      <div class="card" tabindex="0" role="button" aria-pressed="false">
        <div class="icon" aria-hidden="true">🆔</div>
        <h3>Aadhaar</h3>
      </div>
      <div class="card" tabindex="0" role="button" aria-pressed="false">
        <div class="icon" aria-hidden="true">💡</div>
        <h3>Electricity Bills</h3>
      </div>
      <div class="card" tabindex="0" role="button" aria-pressed="false">
        <div class="icon" aria-hidden="true">📝</div>
        <h3>Complaints</h3>
      </div>
      <div class="card" tabindex="0" role="button" aria-pressed="false">
        <div class="icon" aria-hidden="true">🎯</div>
        <h3>Schemes</h3>
      </div>
      <div class="card" tabindex="0" role="button" aria-pressed="false">
        <div class="icon" aria-hidden="true">🚨</div>
        <h3>Emergency</h3>
      </div>
    </section>
  </main>

  <!-- Floating Chatbot -->
  <div id="chatbot" class="chatbot" role="dialog" aria-modal="true" aria-labelledby="chatbot-title" hidden>
    <div class="chatbot-header">
      <h4 id="chatbot-title" style="margin:0;">CivicEase Chatbot</h4>
      <button id="close-chat-btn" aria-label="Close chat">✖</button>
    </div>
    <div class="chatbot-messages" id="chatbot-messages" aria-live="polite" aria-relevant="additions"></div>
    <div class="chatbot-input-area">
      <input
        type="text"
        id="chat-input"
        placeholder="Type your query..."
        aria-label="Chat input"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="send-btn" aria-label="Send message">➤</button>
      <button id="mic-btn" class="mic-btn" aria-pressed="false" aria-label="Toggle voice input">🎙️</button>
    </div>
  </div>

  <!-- Floating open chat button -->
  <button id="open-chat-btn" class="open-chat-btn" aria-label="Open chat" aria-haspopup="dialog" aria-controls="chatbot" aria-expanded="false">💬</button>

  <script>
    (function () {
      // Elements
      const headerVoiceBtn = document.getElementById("header-voice-btn");
      const startChatBtn = document.getElementById("start-chat-btn");
      const openChatBtn = document.getElementById("open-chat-btn");
      const chatbot = document.getElementById("chatbot");
      const closeChatBtn = document.getElementById("close-chat-btn");
      const messagesContainer = document.getElementById("chatbot-messages");
      const chatInput = document.getElementById("chat-input");
      const sendBtn = document.getElementById("send-btn");
      const micBtn = document.getElementById("mic-btn");

      // State
      let isChatOpen = false;
      let listening = false;
      let messages = [
        { from: "bot", text: "Hello! I can help you with Aadhaar, Ration Card, Bills & more." },
      ];

      // Speech Recognition Setup
      let recognition = null;
      if ("webkitSpeechRecognition" in window) {
        recognition = new window.webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = "en-IN";

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          chatInput.value = transcript;
          handleSend(transcript);
        };
        recognition.onerror = () => {
          setListening(false);
        };
        recognition.onend = () => {
          setListening(false);
        };
      }

      // Functions
      function setListening(state) {
        listening = state;
        headerVoiceBtn.classList.toggle("listening", listening);
        micBtn.classList.toggle("listening", listening);
        headerVoiceBtn.textContent = listening ? "Listening..." : "🎙️ Voice Command";
        headerVoiceBtn.setAttribute("aria-pressed", listening.toString());
        micBtn.setAttribute("aria-pressed", listening.toString());
      }

      function toggleListening() {
        if (!recognition) {
          alert("Speech Recognition not supported in this browser.");
          return;
        }
        if (!listening) {
          setListening(true);
          recognition.start();
        } else {
          setListening(false);
          recognition.stop();
        }
      }

      function renderMessages() {
        messagesContainer.innerHTML = "";
        messages.forEach((m) => {
          const div = document.createElement("div");
          div.className = "message " + (m.from === "bot" ? "bot" : "user");
          div.textContent = m.text;
          messagesContainer.appendChild(div);
        });
        // Scroll to bottom
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function handleSend(text) {
        const userText = text || chatInput.value.trim();
        if (!userText) return;
        messages.push({ from: "user", text: userText });
        renderMessages();
        chatInput.value = "";
        // Simulate bot response after 1s
        setTimeout(() => {
          messages.push({
            from: "bot",
            text: "Here’s some info on that! (Demo response)",
          });
          renderMessages();
        }, 1000);
      }

      function openChat() {
        isChatOpen = true;
        chatbot.hidden = false;
        openChatBtn.style.display = "none";
        startChatBtn.setAttribute("aria-expanded", "true");
        openChatBtn.setAttribute("aria-expanded", "true");
        chatInput.focus();
        renderMessages();
      }

      function closeChat() {
        isChatOpen = false;
        chatbot.hidden = true;
        openChatBtn.style.display = "block";
        startChatBtn.setAttribute("aria-expanded", "false");
        openChatBtn.setAttribute("aria-expanded", "false");
        setListening(false);
      }

      // Event Listeners
      headerVoiceBtn.addEventListener("click", toggleListening);
      micBtn.addEventListener("click", toggleListening);

      sendBtn.addEventListener("click", () => {
        handleSend();
      });

      chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          handleSend();
        }
      });

      startChatBtn.addEventListener("click", openChat);
      openChatBtn.addEventListener("click", openChat);
      closeChatBtn.addEventListener("click", closeChat);

      // Accessibility: close chat on Escape key
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && isChatOpen) {
          closeChat();
        }
      });

      // Initial render
      renderMessages();
    })();
  </script>
</body>
</html>
